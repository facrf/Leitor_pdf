name: Publicar imagem Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/estante-livre

jobs:
  test:
    name: Testes Rust e interface
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache do Cargo
        uses: Swatinem/rust-cache@v2
      - name: Verificar formatação Rust
        run: cargo fmt --check
      - name: Executar Clippy sem aceitar avisos
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Executar testes Rust
        run: cargo test --locked
      - name: Validar volume de 2.287 livros
        run: cargo test --locked indexes_2287_files -- --ignored
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências dos testes
        run: npm ci
      - name: Validar contrato da interface
        run: npm run test:ui
      - name: Executar E2E da API e cenários de falha
        run: npm run test:api
      - name: Executar E2E de autenticação
        run: npm run test:auth
      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Executar E2E em navegador real
        run: npm run test:browser
      - name: Preservar relatório do navegador em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            tests/runtime-data-playwright-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validar Docker Compose
        run: docker compose config --quiet
      - name: Construir imagem de produção
        run: docker build --tag estante-livre:ci .

  publish:
    name: GHCR multi-plataforma
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar emulação para ARM
        uses: docker/setup-qemu-action@v3

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Gerar e publicar manifest multi-plataforma
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
