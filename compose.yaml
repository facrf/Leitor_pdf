services:
  estante-livre:
    # Imagem oficial publicada no GHCR ou construida localmente
    image: ${ESTANTE_IMAGE:-ghcr.io/facrf/estante-livre:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estante-livre
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "20000:20000"
    environment:
      APP_BIND: 0.0.0.0:20000
      LIBRARY_ROOT: /pdf
      DATABASE_PATH: /data/library.db
      COVERS_DIR: /data/covers
      BRANDING_DIR: /data/branding
      BACKUP_DIR: /data/backups
      COVER_TIMEOUT_SECONDS: ${COVER_TIMEOUT_SECONDS:-60}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-15}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-estante_livre=info,tower_http=info}
    volumes:
      - ./pdf:/pdf
      - ./data:/data
